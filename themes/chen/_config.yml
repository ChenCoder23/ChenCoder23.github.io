# ChenBlog 主题配置
social:
  github: "https://github.com/ChenCoder23"

# 后台管理页面位于 /admin/，但前台（阅读端）不提供任何入口，读者看不到编辑按钮。
# 如果想在文章页显示「编辑本文」按钮（直达 /admin/?edit=...），把 editLink 改成 true 即可。
admin:
  enabled: true
  editLink: false

comments:
  enabled: true
  giscus:
    repo: "ChenCoder23/ChenCoder23.github.io"
    repo_id: "R_kgDOUDiL6Q"
    category: "Announcements"
    category_id: "DIC_kwDOUDiL6c4DEJRL"
    mapping: "pathname"
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: "bottom"
    theme: "preferred_color_scheme"
    lang: "zh-CN"
    loading: "lazy"
