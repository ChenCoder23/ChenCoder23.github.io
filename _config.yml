# ChenBlog 站点配置
title: 陈会闯的博客
subtitle: ''
description: ''
keywords:
author: 陈会闯
language: zh-CN
timezone: Asia/Shanghai

# 部署地址（用户主页仓库 ChenCoder23.github.io）
url: https://ChenCoder23.github.io/
root: /

permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
i18n_dir: :lang
# 后台管理页面必须原样复制到 public/admin/，不能套用主题布局
skip_render:
  - 'admin/**'

theme: chen

index_generator:
  per_page: 0
category_generator:
  per_page: 0
tag_generator:
  per_page: 0
archive_generator:
  per_page: 0

# 代码高亮：行号关闭，便于阅读与一键复制
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: "  "
  wrap: true
  hljs: false
