<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4eb">
  <title>鹈鹕出走记 · A little ride by the sea</title>
  <style>
    :root { color-scheme: light; --paper:#f7f4eb; --ink:#294940; --muted:#7c8980; --orange:#db6a46; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; background:var(--paper); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; -webkit-tap-highlight-color:transparent; }
    .page { width:min(1320px,100%); margin:auto; padding:30px 44px 22px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; padding-bottom:26px; }
    .brand { display:flex; gap:11px; align-items:center; }
    .brand-mark { width:36px; height:36px; }
    .brand-name { font-size:16px; font-weight:650; letter-spacing:2px; }
    .brand-sub { margin-top:4px; font-size:9px; font-weight:600; letter-spacing:2.6px; color:var(--muted); }
    .edition { font-size:10px; letter-spacing:2px; display:flex; align-items:center; gap:11px; }
    .edition i { width:6px; height:6px; border-radius:50%; background:var(--orange); }
    .artwork { position:relative; overflow:hidden; isolation:isolate; border-radius:18px; background:#dbeae3; box-shadow:0 10px 40px #24493f08; }
    #scene { display:block; width:100%; height:auto; aspect-ratio:1440/900; }
    .art-heading { position:absolute; z-index:1; left:5%; top:7%; pointer-events:none; }
    .eyebrow { margin:0 0 15px; font-size:10px; letter-spacing:3.7px; font-weight:600; color:#527568; }
    h1 { margin:0; font-size:clamp(23px,3.1vw,44px); font-weight:500; letter-spacing:4px; line-height:1.5; }
    .caption { margin:11px 0 0; font-size:12px; letter-spacing:2px; color:#6a887a; }
    .scene-label { position:absolute; left:5%; bottom:5.4%; font-size:9px; letter-spacing:2.4px; color:#6d7a57; }
    .scene-label span { display:block; margin-top:9px; font-size:11px; letter-spacing:1px; }
    .postmark { position:absolute; right:4.7%; top:7%; width:76px; height:76px; border:1px solid #6f8b7045; border-radius:50%; color:#64846e; display:flex; align-items:center; justify-content:center; text-align:center; font-size:9px; letter-spacing:2px; line-height:1.8; transform:rotate(12deg); }
    .postmark::before { content:""; position:absolute; inset:5px; border:1px solid #6f8b7030; border-radius:50%; }
    footer { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:22px; }
    .footer-copy { font-size:11px; letter-spacing:1.4px; color:var(--muted); }
    .footer-copy strong { font-weight:500; color:var(--ink); margin-right:14px; }
    .controls { display:flex; align-items:center; gap:16px; }
    .play { width:36px; height:36px; display:grid; place-items:center; padding:0; border:1px solid #29494025; border-radius:50%; color:var(--ink); background:transparent; cursor:pointer; transition:background .2s,transform .2s; }
    .play:hover { background:#e8eddf; transform:scale(1.05); }
    .play svg { width:13px; height:13px; }
    .speeds { display:flex; border-radius:30px; padding:4px; background:#eaece2; gap:2px; }
    .speed { border:0; background:transparent; color:#809084; font-size:11px; padding:7px 14px; border-radius:20px; cursor:pointer; transition:color .2s,background .2s,box-shadow .2s; }
    .speed[aria-pressed="true"] { background:#fffdf6; color:var(--ink); box-shadow:0 1px 5px #2949400c; }
    .soundless { font-size:9px; letter-spacing:1.8px; color:#9a9e90; display:flex; align-items:center; gap:7px; }
    .soundless::before { content:""; width:4px; height:4px; border-radius:50%; background:#9aa68e; }
    button:focus-visible { outline:2px solid var(--orange); outline-offset:4px; }
    @media (min-width:1600px) { .page { padding-top:38px; } }
    @media (max-width:700px) {
      .page { padding:22px 16px 18px; }
      header { padding-bottom:21px; }
      .brand-name { font-size:14px; }
      .edition { font-size:8px; letter-spacing:1px; }
      .brand-sub { font-size:7px; }
      .artwork { border-radius:12px; }
      #scene { aspect-ratio:920/1070; }
      .art-heading { left:7%; top:6%; }
      h1 { font-size:26px; letter-spacing:3px; }
      .eyebrow { font-size:8px; margin-bottom:10px; letter-spacing:2px; }
      .caption { font-size:10px; letter-spacing:1px; margin-top:5px; }
      .postmark { width:54px; height:54px; font-size:7px; right:6%; top:7%; }
      .scene-label { left:7%; bottom:6%; font-size:7px; }
      .scene-label span { font-size:9px; }
      footer { flex-wrap:wrap; padding-top:18px; row-gap:17px; }
      .footer-copy { width:100%; font-size:10px; }
      .controls { gap:12px; }
      .speed { padding:7px 13px; font-size:10px; }
      .soundless { margin-left:auto; font-size:8px; letter-spacing:1px; }
    }
  </style>
</head>

          <path d="M576 413Q575 456 633 466Q685 481 728 448Q685 467 645 450Q608 436 598 405Z" fill="#e9e2c6" opacity=".8"/>
          <path d="M738 261Q734 292 747 313Q755 323 757 337" fill="none" stroke="#e0ddc0" stroke-width="10" stroke-linecap="round"/>
          <path d="M762 310Q767 305 771 298" fill="none" stroke="#a1ad8b" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Cycling cap and its little peak. -->
          <path d="M738 228Q735 200 766 192Q798 185 814 209L819 227Q781 216 738 228Z" fill="#547f67" stroke="#355a49" stroke-width="3"/>
          <path d="M766 193Q784 202 786 220" fill="none" stroke="#93b18a" stroke-width="7"/>
          <path d="M786 220Q815 212 841 224Q847 229 838 232L803 230Z" fill="#759a77" stroke="#355a49" stroke-width="2.5"/>
          <path d="M749 223Q751 249 769 262" fill="none" stroke="#6f8e70" stroke-width="3"/>
          <circle cx="768" cy="263" r="4" fill="#68886b"/>

          <!-- Beak, supple pouch, a tiny smile, and a blinking eye. -->
          <g id="beak">
            <path d="M815 252Q838 257 858 266L1001 277Q976 300 921 313Q871 347 842 315Q828 297 815 277Z" fill="url(#pouch)" stroke="#bc7b4f" stroke-width="3" stroke-linejoin="round"/>
            <path d="M836 281Q851 315 878 320" fill="none" stroke="#ffce97" stroke-width="4" stroke-linecap="round"/>
            <path d="M818 245Q870 242 931 256L1003 274Q1015 280 1001 284L826 279Q816 273 818 245Z" fill="#edb669" stroke="#ad784c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M834 258Q912 261 982 276" fill="none" stroke="#ffda8c" stroke-width="4" stroke-linecap="round"/>
            <path d="M827 279 1001 280" stroke="#b57546" stroke-width="2" stroke-linecap="round"/>
            <path d="M996 273l12 4-8 6" fill="#c4834a"/>
            <path d="M851 254l13 2" stroke="#be8851" stroke-width="2.5" stroke-linecap="round"/>
          </g>
          <ellipse cx="801" cy="258" rx="11" ry="7" fill="#e7bc93" opacity=".55"/>
          <g id="eye" transform="translate(799 242)"><circle r="7.5" fill="#fffdf2"/><circle r="4.8" fill="#2e493d"/><circle cx="1.5" cy="-1.7" r="1.5" fill="#fffdf2"/></g>
          <path d="M792 228q8-4 13 1" stroke="#63765b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

          <!-- A scarf, and a wing reaching all the way to the handlebar. -->
          <path d="M722 328Q744 346 779 340L775 358Q741 365 719 345Z" fill="#e5845e" stroke="#ad6046" stroke-width="2.5"/>
          <path d="M729 336Q749 351 771 347" fill="none" stroke="#f5b283" stroke-width="3" stroke-linecap="round"/>
          <path d="M620 363Q649 347 677 369Q709 395 746 409Q790 421 866 408Q879 407 884 414Q892 422 880 430Q858 440 808 440Q744 442 699 425Q673 425 649 413Q626 400 614 383Q608 370 620 363Z" fill="#f5f1da" stroke="#63755c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M628 374Q656 373 678 398Q706 418 745 422" fill="none" stroke="#c7cbb0" stroke-width="3" stroke-linecap="round"/>
          <path d="M659 402q37 30 74 27M680 408q30 24 60 24M858 421l20-4M858 428l20-5" fill="none" stroke="#b5bfa0" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M592 427q9 13 22 15M600 417q11 14 23 16" fill="none" stroke="#cfceb0" stroke-width="2.5" stroke-linecap="round"/>

        <!-- A few breeze marks make the quiet motion visible. -->
        <g id="breeze" fill="none" stroke="#739a81" stroke-width="3" stroke-linecap="round" opacity=".55"><path d="M401 361h52m-75 17h38m-14 104h36"/><path d="M1079 355h40q17 0 17-10t-11-8" stroke-width="2"/></g>

        <!-- Foreground objects repeat beyond the edge of the viewBox. -->
        <g id="foreground" transform="translate(0 0)">
          <g transform="translate(0 0)"><use href="#grass" transform="translate(89 836) scale(1.1)"/><use href="#flowers" transform="translate(177 845) scale(.8)"/><use href="#plant" transform="translate(1321 852) scale(.85)"/><use href="#grass" transform="translate(1244 849) scale(.8)"/><path d="M291 844q11-14 30-2l4 8h-41Z" fill="#c7bd95"/><path d="M1137 834q13-13 27 2l-2 6h-34Z" fill="#d1c59c"/></g>
          <g transform="translate(1440 0)"><use href="#grass" transform="translate(89 836) scale(1.1)"/><use href="#flowers" transform="translate(177 845) scale(.8)"/><use href="#plant" transform="translate(1321 852) scale(.85)"/><use href="#grass" transform="translate(1244 849) scale(.8)"/><path d="M291 844q11-14 30-2l4 8h-41Z" fill="#c7bd95"/><path d="M1137 834q13-13 27 2l-2 6h-34Z" fill="#d1c59c"/></g>

        <path d="M0 802H1440V940H0Z" fill="url(#groundFade)" pointer-events="none"/>
        <path d="M0-180H1440V940H0Z" fill="url(#paper)" pointer-events="none"/>
      </svg>
      <div class="scene-label">NO DESTINATION. JUST A GOOD DAY.<span>不赶路，去感受路。</span></div>
    </section>

    <footer>
      <div class="footer-copy"><strong>今日宜 · 兜风</strong>把时间交给海风。</div>
      <div class="controls" aria-label="动画控制">
        <button class="play" id="play" type="button" aria-label="暂停动画" title="暂停 / 继续（空格）" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M4 2h3v12H4zM10 2h3v12h-3z"/></svg></button>
        <div class="speeds" role="group" aria-label="骑行速度"><button class="speed" type="button" data-speed="0.6" aria-pressed="false">慢慢骑</button><button class="speed" type="button" data-speed="1" aria-pressed="true">兜个风</button><button class="speed" type="button" data-speed="1.65" aria-pressed="false">追着风</button></div>
      </div>
      <div class="soundless">JUST KEEP PEDALING</div>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const nodes = Object.fromEntries(['backWheel','frontWheel','crankArm','rearLegPath','frontLegPath','frontLegHighlight','rearFoot','frontFoot','pelican','scarfTail','beak','eye','roadMarks','gravel','foreground','clouds','seaLines','birds','breeze','bouquet','bikeShadow'].map(id => [id,byId(id)]));
      const play = byId('play');
      const speedButtons = [...document.querySelectorAll('.speed')];
      let running = true;
      let speed = 1;
      let desiredSpeed = 1;
      let elapsed = 0;
      let previous = null;
      const scene = byId('scene');
      const mobileLayout = window.matchMedia('(max-width:700px)');
      const compose = () => scene.setAttribute('viewBox',mobileLayout.matches ? '260 -150 920 1070' : '0 0 1440 900');
      mobileLayout.addEventListener('change',compose);
      compose();
      const crank = { x:687, y:628, radius:43 };
      const upperLeg = 122;
      const lowerLeg = 120;
      const setTransform = (node,value) => node.setAttribute('transform',value);

      // A two-link leg solves its knee from a fixed hip and a moving ankle.
      // Both pedal positions share one angle, so no part can drift out of sync.
      function legPath(phase,bob) {
        const hip = { x:650, y:452 + bob };
        const ankle = { x:crank.x + Math.cos(phase)*crank.radius, y:crank.y + Math.sin(phase)*crank.radius - 15 };
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx,dy);
        const direction = Math.atan2(dy,dx);
        const bend = Math.acos(Math.max(-1,Math.min(1,(upperLeg*upperLeg + distance*distance - lowerLeg*lowerLeg)/(2*upperLeg*distance))));
        const knee = { x:hip.x + Math.cos(direction-bend)*upperLeg, y:hip.y + Math.sin(direction-bend)*upperLeg };
        return { path:`M${hip.x} ${hip.y}Q${hip.x+4} ${hip.y+8} ${knee.x} ${knee.y}L${ankle.x} ${ankle.y}`, ankle };
      }

      function draw(time) {
        const angle = time * 2.45;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle*2) * 2.8;
        const distance = angle * 139 * 1.65;
        setTransform(nodes.backWheel,`rotate(${degrees*1.65})`);
        setTransform(nodes.frontWheel,`rotate(${degrees*1.65})`);
        setTransform(nodes.crankArm,`rotate(${degrees})`);
        const front = legPath(angle,bob);
        const rear = legPath(angle+Math.PI,bob);
        nodes.frontLegPath.setAttribute('d',front.path);
        nodes.frontLegHighlight.setAttribute('d',front.path);
        nodes.rearLegPath.setAttribute('d',rear.path);
        setTransform(nodes.frontFoot,`translate(${front.ankle.x} ${front.ankle.y})`);
        setTransform(nodes.rearFoot,`translate(${rear.ankle.x} ${rear.ankle.y})`);
        setTransform(nodes.pelican,`translate(0 ${bob})`);
        const flutter = Math.sin(time*5.5)*7 + Math.sin(time*9)*2;
        nodes.scarfTail.setAttribute('d',`M743 332Q689 ${319+flutter*.4} 661 ${330+flutter*.7}L604 ${312+flutter} 624 ${342+flutter*.7} 597 ${350+flutter}Q652 ${369+flutter*.5} 708 354L750 351Z`);
        setTransform(nodes.beak,`rotate(${Math.sin(angle*2-.3)*.55} 818 254)`);
        const blinkPhase = time % 5.2;
        const blink = blinkPhase > 4.93 ? Math.max(.06,Math.abs((blinkPhase-5.065)/.135)) : 1;
        setTransform(nodes.eye,`translate(799 242) scale(1 ${blink})`);
        setTransform(nodes.roadMarks,`translate(${-distance%325} 0)`);
        setTransform(nodes.gravel,`translate(${-distance%1440} 0)`);
        setTransform(nodes.foreground,`translate(${-distance%1440} 0)`);
        setTransform(nodes.clouds,`translate(${-(time*7)%1440} ${Math.sin(time*.35)*3})`);
        setTransform(nodes.seaLines,`translate(${Math.sin(time*.45)*16} 0)`);
        setTransform(nodes.birds,`translate(${Math.sin(time*.18)*26} ${Math.sin(time*1.3)*3})`);
        setTransform(nodes.breeze,`translate(${Math.sin(time*3)*9} 0)`);
        nodes.breeze.setAttribute('opacity',String(.38 + Math.sin(time*2.7)*.12));
        setTransform(nodes.bouquet,`translate(1010 450) rotate(${Math.sin(angle*2+.4)*2} 0 15)`);
        nodes.bikeShadow.setAttribute('opacity',String(.93 + Math.sin(angle*2)*.07));
      }

      function frame(now) {
        const dt = previous === null ? 0 : Math.min((now-previous)/1000,.05);
        previous = now;
        if (running) {
          speed += (desiredSpeed-speed)*Math.min(1,dt*4);
          elapsed += dt*speed;
          draw(elapsed);
        }
        requestAnimationFrame(frame);
      }

      function togglePlay() {
        running = !running;
        play.setAttribute('aria-label',running ? '暂停动画' : '继续动画');
        play.setAttribute('aria-pressed',String(!running));
        byId('playIcon').setAttribute('d',running ? 'M4 2h3v12H4zM10 2h3v12h-3z' : 'M4 2.2v11.6L13 8z');
      }
      play.addEventListener('click',togglePlay);
      speedButtons.forEach(button => button.addEventListener('click',() => {
        desiredSpeed = Number(button.dataset.speed);
        speedButtons.forEach(candidate => candidate.setAttribute('aria-pressed',String(candidate === button)));
      }));
      document.addEventListener('keydown',event => {
        if (event.code === 'Space' && !event.repeat && !['BUTTON','INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
          event.preventDefault();
          togglePlay();
        }
      });
      document.addEventListener('visibilitychange',() => { previous = null; });
      draw(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
