<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            background: #87ceeb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- 地面 -->
    <rect x="0" y="320" width="800" height="80" fill="#7ccd7c"/>
    <path d="M0,320 Q200,310 400,320 T800,320" stroke="#558b2f" stroke-width="3" fill="none"/>

    <!-- 移动组：整车+鹈鹕，水平滚动 -->
    <g>
        <animateTransform attributeName="transform" type="translate" from="-200,0" to="900,0" dur="12s" repeatCount="indefinite"/>
        <g transform="translate(100, 200)">
            <!-- 后轮 -->
            <circle cx="0" cy="100" r="40" fill="#333" stroke="#111" stroke-width="2">
                <animateTransform attributeName="transform" type="rotate" from="0 0 100" to="360 0 100" dur="0.8s" repeatCount="indefinite"/>
            </circle>
            <circle cx="0" cy="100" r="34" fill="#444"/>
            <!-- 前轮 -->
            <circle cx="140" cy="100" r="40" fill="#333" stroke="#111" stroke-width="2">
                <animateTransform attributeName="transform" type="rotate" from="0 140 100" to="360 140 100" dur="0.8s" repeatCount="indefinite"/>
            </circle>
            <circle cx="140" cy="100" r="34" fill="#444"/>

            <!-- 车架 -->
            <path d="M0,100 L70,30 L140,100 M70,30 L70,100 M70,100 L0,100" stroke="#8b4513" stroke-width="6" fill="none"/>
            <!-- 车把手 -->
            <path d="M140,30 L160,18 M140,30 L120,18" stroke="#8b4513" stroke-width="5" fill="none"/>
            <!-- 坐垫 -->
            <ellipse cx="50" cy="22" rx="18" ry="7" fill="#222"/>

            <!-- 踏板曲柄 -->
            <g>
                <animateTransform attributeName="transform" type="rotate" from="0 70 100" to="360 70 100" dur="0.8s" repeatCount="indefinite"/>
                <line x1="70" y1="100" x2="70" y2="75" stroke="#222" stroke-width="4"/>
                <rect x="64" y="70" width="12" height="8" rx="2" fill="#222"/>
                <line x1="70" y1="100" x2="70" y2="125" stroke="#222" stroke-width="4"/>
                <rect x="64" y="122" width="12" height="8" rx="2" fill="#222"/>
            </g>

            <!-- 鹈鹕身体 -->
            <ellipse cx="70" cy="10" rx="38" ry="28" fill="#ffffff" stroke="#222" stroke-width="2"/>
            <!-- 鹈鹕脖子+头 -->
            <path d="M95,-10 C125,-35 155,-28 165,-12" stroke="#fff" stroke-width="16" fill="none"/>
            <circle cx="165" cy="-12" r="14" fill="#fff"/>
            <!-- 鹈鹕大嘴皮囊 -->
            <path d="M165,-12 C190,-8 200,5 182,12 C170,16 160,8 165,-12 Z" fill="#ffb347" stroke="#cc7722" stroke-width="1.5"/>
            <!-- 眼睛 -->
            <circle cx="170" cy="-16" r="2.5" fill="#000"/>

            <!-- 翅膀（扇动动画） -->
            <path d="M50,0 C20,-15 10,5 25,18 Z" fill="#f0f0f0" stroke="#333">
                <animateTransform attributeName="transform" type="rotate" values="0 50 0; -15 50 0; 0 50 0; 15 50 0; 0 50 0" dur="1.2s" repeatCount="indefinite"/>
            </path>

            <!-- 鹈鹕腿踩踏板 -->
            <g>
                <animateTransform attributeName="transform" type="rotate" from="0 70 100" to="360 70 100" dur="0.8s" repeatCount="indefinite"/>
                <line x1="70" y1="10" x2="70" y2="75" stroke="#fff" stroke-width="7"/>
            </g>
        </g>
    </g>

    <!-- 云朵装饰 -->
    <g fill="#fff" opacity="0.8">
        <circle cx="120" cy="70" r="22"/>
        <circle cx="145" cy="65" r="28"/>
        <circle cx="170" cy="70" r="20"/>

        <circle cx="500" cy="90" r="18"/>
        <circle cx="522" cy="84" r="24"/>
        <circle cx="545" cy="90" r="16"/>
    </g>
</svg>
</body>
</html>
