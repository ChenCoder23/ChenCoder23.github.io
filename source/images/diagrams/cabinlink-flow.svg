  <text x="380" y="201" text-anchor="middle" font-size="16" font-weight="700" fill="#23262B">创建智能柜</text>

  <line x1="380" y1="222" x2="380" y2="256" stroke="#3D6B6A" stroke-width="2" marker-end="url(#cl-arr)"/>

  <rect x="220" y="262" width="320" height="54" rx="12" fill="#FFFFFF" stroke="#3D6B6A" stroke-width="2"/>
  <text x="380" y="295" text-anchor="middle" font-size="16" font-weight="700" fill="#23262B">新建主题</text>

  <line x1="380" y1="316" x2="380" y2="350" stroke="#3D6B6A" stroke-width="2" marker-end="url(#cl-arr)"/>

  <rect x="220" y="356" width="320" height="54" rx="12" fill="#FFFFFF" stroke="#3D6B6A" stroke-width="2"/>
  <text x="380" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#23262B">上传照片和文件</text>

  <line x1="380" y1="410" x2="380" y2="444" stroke="#3D6B6A" stroke-width="2" marker-end="url(#cl-arr)"/>

  <rect x="220" y="450" width="320" height="54" rx="12" fill="#FFFFFF" stroke="#C9483B" stroke-width="2"/>
