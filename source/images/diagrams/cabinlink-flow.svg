  <text x="380" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#23262B">登录 / 注册</text>

  <line x1="380" y1="128" x2="380" y2="162" stroke="#3D6B6A" stroke-width="2" marker-end="url(#cl-arr)"/>

