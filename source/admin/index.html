<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChenBlog 后台管理</title>
  <link rel="stylesheet" href="./admin.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.2.0/marked.min.js"></script>
</head>
<body>
  <div class="admin">
    <aside class="sidebar">
      <div class="brand">ChenBlog <span>后台</span></div>
      <nav>
        <button class="nav-btn active" data-view="posts">文章管理</button>
        <button class="nav-btn" data-view="editor">新建文章</button>
        <button class="nav-btn" data-view="categories">分类管理</button>
        <button class="nav-btn" data-view="site">站点设置</button>
        <button class="nav-btn" data-view="settings">账号设置</button>
      </nav>
      <a class="view-site" href="../" target="_blank" rel="noopener">查看博客 ↗</a>
    </aside>
    <main class="content" id="content"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="./admin.js"></script>
</body>
</html>
